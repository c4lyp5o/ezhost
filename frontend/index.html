    <title>ezhost</title>
    <script>
      // Dark is the default theme — apply the class before first paint to
      // avoid a light flash. The toggle persists "light"/"dark" under ezhost-theme.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ezhost-theme");
        } catch (e) {}
        if (saved !== "light") document.documentElement.classList.add("dark");
      })();
    </script>
