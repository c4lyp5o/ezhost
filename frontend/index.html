<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="theme-color" content="#171719" />

    <title>ezhost</title>
    <script>
      // Dark is the default theme — apply the class before first paint to
      // avoid a light flash. The toggle persists "light"/"dark" under ezhost-theme.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ezhost-theme");
        } catch (e) {}
        if (saved !== "light") document.documentElement.classList.add("dark");
        else document.documentElement.classList.add("light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
